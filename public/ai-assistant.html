<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title data-store-name>AI Assistant — Modern Mercantile</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
      @keyframes bounceDot {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-4px); opacity: 1; }
      }
      .typing-dot {
        animation: bounceDot 1.2s infinite;
      }
      .typing-dot:nth-child(2) { animation-delay: 0.15s; }
      .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#454746",
              secondary: "#5d5f5d",
              "on-tertiary": "#ffffff",
              outline: "#707974",
              "on-primary-container": "#86bba7",
              "surface-container": "#efeeea",
              "on-primary-fixed": "#002117",
              "on-primary": "#ffffff",
              "secondary-container": "#e2e3e0",
              "outline-variant": "#c0c9c3",
              "inverse-on-surface": "#f2f1ed",
              "secondary-fixed-dim": "#c6c7c5",
              "primary-fixed-dim": "#9cd2bc",
              "on-secondary": "#ffffff",
              "on-surface": "#1b1c1a",
              "tertiary-fixed-dim": "#ffb4a7",
              "inverse-primary": "#9cd2bc",
              error: "#ba1a1a",
              "tertiary-container": "#7a271a",
              "secondary-fixed": "#e2e3e0",
              background: "#faf9f5",
              "on-secondary-container": "#636563",
              "surface-dim": "#dbdad6",
              "surface-container-high": "#e9e8e4",
              primary: "#003427",
              "on-primary-fixed-variant": "#1a4f3f",
              "surface-container-highest": "#e3e2df",
              "error-container": "#ffdad6",
              "on-tertiary-fixed": "#400200",
              "inverse-surface": "#30312e",
              "on-surface-variant": "#404945",
              "on-secondary-fixed": "#1a1c1b",
              "on-tertiary-fixed-variant": "#7e2a1d",
              "on-error-container": "#93000a",
              surface: "#faf9f5",
              "primary-fixed": "#b8eed8",
              "on-error": "#ffffff",
              "primary-container": "#164c3c",
              tertiary: "#5b1107",
              "surface-tint": "#346856",
              "on-tertiary-container": "#ff937f",
              "surface-bright": "#faf9f5",
              "on-background": "#1b1c1a",
              "surface-container-lowest": "#ffffff",
              "surface-variant": "#e3e2df",
              "surface-container-low": "#f5f4f0",
              "tertiary-fixed": "#ffdad4",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              "grid-margin-desktop": "3rem",
              "inset-card": "1.5rem",
              "gap-editorial": "4rem",
              "gutter-tablet": "1.5rem",
              "section-mobile": "4rem",
              "grid-margin-mobile": "1.25rem",
              "gutter-mobile": "1rem",
              "grid-margin-tablet": "2rem",
              "section-desktop": "7rem",
              "gutter-desktop": "2rem",
            },
            fontFamily: {
              "headline-lg": ["Plus Jakarta Sans", "sans-serif"],
              "display-hero": ["Plus Jakarta Sans", "sans-serif"],
              "body-lg": ["Plus Jakarta Sans", "sans-serif"],
              "body-sm": ["Plus Jakarta Sans", "sans-serif"],
              "price-lg": ["Plus Jakarta Sans", "sans-serif"],
              "label-eyebrow": ["Plus Jakarta Sans", "sans-serif"],
              "body-md": ["Plus Jakarta Sans", "sans-serif"],
              "price-md": ["Plus Jakarta Sans", "sans-serif"],
              "label-meta": ["Plus Jakarta Sans", "sans-serif"],
              "title-product": ["Plus Jakarta Sans", "sans-serif"],
              "display-hero-mobile": ["Plus Jakarta Sans", "sans-serif"],
              "headline-lg-mobile": ["Plus Jakarta Sans", "sans-serif"],
              "headline-md": ["Plus Jakarta Sans", "sans-serif"],
            },
            fontSize: {
              "headline-lg": ["34px", { lineHeight: "42px", letterSpacing: "-0.02em", fontWeight: "500" }],
              "display-hero": ["56px", { lineHeight: "64px", letterSpacing: "-0.03em", fontWeight: "600" }],
              "body-lg": ["16px", { lineHeight: "26px", letterSpacing: "-0.005em", fontWeight: "400" }],
              "body-sm": ["13px", { lineHeight: "18px", letterSpacing: "0em", fontWeight: "400" }],
              "price-lg": ["20px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "500" }],
              "label-eyebrow": ["11px", { lineHeight: "14px", letterSpacing: "0.12em", fontWeight: "600" }],
              "body-md": ["14px", { lineHeight: "22px", letterSpacing: "0em", fontWeight: "400" }],
              "price-md": ["15px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "500" }],
              "label-meta": ["12px", { lineHeight: "16px", letterSpacing: "0.04em", fontWeight: "500" }],
              "title-product": ["17px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "500" }],
              "display-hero-mobile": ["38px", { lineHeight: "44px", letterSpacing: "-0.025em", fontWeight: "600" }],
              "headline-lg-mobile": ["26px", { lineHeight: "34px", letterSpacing: "-0.015em", fontWeight: "500" }],
              "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "500" }],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-background font-body-md text-on-surface antialiased">
    <!-- Notification Toast Container -->
    <div id="toast-region" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- =========================================================================
         HEADER & NAVIGATION BAR (same as index.html)
         ========================================================================= -->
    <header
      class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant"
    >
      <div
        class="h-20 max-w-[1440px] mx-auto px-grid-margin-mobile md:px-grid-margin-tablet lg:px-grid-margin-desktop flex items-center justify-between gap-gutter-mobile md:gap-gutter-desktop"
      >
        <div class="flex items-center gap-3 shrink-0">
          <a href="/index.html" class="font-headline-md text-headline-md tracking-tight text-on-surface uppercase hover:opacity-90 transition-opacity" data-store-name>
            Modern Mercantile
          </a>
        </div>

        <nav class="hidden lg:flex items-center gap-8 h-full">
          <a
            class="text-on-surface-variant hover:text-on-surface font-label-meta text-label-meta tracking-wider uppercase transition-colors h-full flex items-center border-b-2 border-transparent"
            href="/index.html"
          >
            Home
          </a>
          <a
            class="text-on-surface-variant hover:text-on-surface font-label-meta text-label-meta tracking-wider uppercase transition-colors h-full flex items-center border-b-2 border-transparent"
            href="/products.html"
          >
            Shop
          </a>
          <a
            aria-current="page"
            class="font-label-meta tracking-wider uppercase transition-colors h-full flex items-center text-on-surface border-b-2 border-primary"
            href="/ai-assistant.html"
          >
            AI Assistant
          </a>
        </nav>

        <div class="flex items-center gap-4 md:gap-6 shrink-0">
          <!-- User Account Slot -->
          <div class="hidden md:flex items-center gap-6">
            <a
              class="text-on-surface-variant hover:text-on-surface font-label-meta text-label-meta tracking-wider uppercase transition-colors"
              id="nav-account-link"
              href="/login.html"
            >
              Sign In
            </a>
            <a
              class="text-on-surface-variant hover:text-on-surface font-label-meta text-label-meta tracking-wider uppercase transition-colors"
              href="/orders.html"
            >
              Orders
            </a>
          </div>

          <!-- Dynamic Cart Pill -->
          <a
            aria-label="Shopping Cart"
            class="group flex items-center gap-1.5 p-1 text-on-surface-variant hover:text-on-surface transition-colors"
            href="/cart.html"
          >
            <span class="material-symbols-outlined">shopping_bag</span>
            <span
              class="inline-flex items-center justify-center h-5 px-1.5 rounded-full bg-primary-container text-on-primary font-body-sm text-body-sm font-medium"
              data-cart-count
            >
              0
            </span>
          </a>

          <!-- User Avatar -->
          <a href="/orders.html" id="nav-avatar-btn" class="relative block">
            <div id="nav-avatar-initial" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center font-label-meta text-label-meta font-bold text-on-surface ring-1 ring-outline-variant">
              <span class="material-symbols-outlined text-[18px]">person</span>
            </div>
          </a>
        </div>
      </div>
    </header>

    <main class="w-full pt-20 bg-background min-h-screen">
      <div class="max-w-[820px] mx-auto px-grid-margin-mobile md:px-grid-margin-tablet lg:px-0 py-10 flex flex-col" style="height: calc(100vh - 5rem);">

        <!-- Page heading -->
        <div class="flex items-center gap-3 mb-6">
          <div class="w-11 h-11 rounded-full bg-primary flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-on-primary text-[22px]">smart_toy</span>
          </div>
          <div>
            <h1 class="font-headline-md text-headline-md text-on-surface">AI Shopping Assistant</h1>
            <p class="font-body-sm text-body-sm text-secondary">Ask about products, prices, or categories.</p>
          </div>
        </div>

        <!-- Chat window -->
        <div class="flex-1 min-h-0 bg-surface-container-lowest border border-outline-variant rounded-xl flex flex-col overflow-hidden shadow-sm">

          <div id="chat-messages" class="flex-1 min-h-0 overflow-y-auto p-5 flex flex-col gap-4">
            <!-- Welcome bubble -->
            <div class="flex items-start gap-2.5 max-w-[85%]">
              <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 mt-0.5">
                <span class="material-symbols-outlined text-on-primary text-[16px]">smart_toy</span>
              </div>
              <div class="bg-surface-container text-on-surface font-body-md text-body-md rounded-xl rounded-tl-sm px-4 py-3">
                Hi! I can help you find the right product, compare prices, or point you to a category. What are you looking for today?
              </div>
            </div>
          </div>

          <!-- Quick suggestions -->
          <div id="chat-suggestions" class="px-5 pb-3 flex flex-wrap gap-2">
            <button type="button" class="suggestion-chip px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant hover:text-on-surface hover:bg-secondary-container font-body-sm text-body-sm transition-colors">
              What's on sale right now?
            </button>
            <button type="button" class="suggestion-chip px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant hover:text-on-surface hover:bg-secondary-container font-body-sm text-body-sm transition-colors">
              What categories do you have?
            </button>
            <button type="button" class="suggestion-chip px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant hover:text-on-surface hover:bg-secondary-container font-body-sm text-body-sm transition-colors">
              Recommend something under $50
            </button>
          </div>

          <!-- Input row -->
          <form id="chat-form" class="border-t border-outline-variant p-4 flex items-end gap-3">
            <textarea
              id="chat-input"
              rows="1"
              maxlength="800"
              placeholder="Type your message..."
              class="flex-1 resize-none max-h-32 rounded-lg bg-surface-container px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-secondary focus:outline-none focus:ring-1 focus:ring-primary border border-transparent focus:border-outline-variant transition-all disabled:opacity-60"
            ></textarea>
            <button
              id="chat-send-btn"
              type="submit"
              class="h-11 w-11 shrink-0 rounded-full bg-primary text-on-primary flex items-center justify-center hover:bg-on-primary-fixed transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <span class="material-symbols-outlined text-[20px]">send</span>
            </button>
          </form>
        </div>
      </div>
    </main>

<script>
  (function () {

    // =========================================================
    // Helpers (نفس الأنماط المستخدمة في index.html)
    // =========================================================

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str == null ? "" : String(str);
      return div.innerHTML;
    }

    function showToast(message) {
      const region = document.getElementById("toast-region");
      if (!region) return;

      const toast = document.createElement("div");
      toast.className =
        "pointer-events-auto bg-error text-on-error px-5 py-3 rounded-lg shadow-lg flex items-center gap-3 transition-all duration-300 transform translate-y-4 opacity-0 text-body-sm font-medium";

      toast.innerHTML = `
        <span class="material-symbols-outlined text-[18px]">error</span>
        <span>${escapeHtml(message)}</span>
      `;

      region.appendChild(toast);

      setTimeout(() => toast.classList.remove("translate-y-4", "opacity-0"), 10);
      setTimeout(() => {
        toast.classList.add("translate-y-4", "opacity-0");
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    // =========================================================
    // Cart badge (لثبات الهيدر بس)
    // =========================================================

    function updateCartBadge() {
      let items = [];
      try {
        const storeCart = JSON.parse(localStorage.getItem("store-cart") || "[]");
        items = storeCart;
      } catch (_) {}

      const count = items.reduce((acc, item) => acc + (Number(item.quantity) || 1), 0);

      document.querySelectorAll("[data-cart-count]").forEach((el) => {
        el.textContent = count;
      });
    }

    updateCartBadge();
    window.addEventListener("storage", updateCartBadge);

    // =========================================================
    // Store name (نفس مصدر البيانات المستخدم في باقي الصفحات)
    // =========================================================

    async function updateStoreName() {
      try {
        const res = await fetch("/api/get_store_settings");
        if (!res.ok) throw new Error();

        const data = await res.json();
        const storeName = data?.data?.store_name;

        if (!storeName) return;

        document.querySelectorAll("[data-store-name]").forEach((el) => {
          if (el.tagName === "TITLE") {
            // نحافظ على جزء اسم الصفحة قبل الشرطة، ونستبدل اسم المتجر بعدها
            const pageLabel = el.textContent.split("—")[0].trim();
            el.textContent = `${pageLabel} — ${storeName}`;
          } else {
            el.textContent = storeName;
          }
        });
      } catch (_) {
        // لو فشل الطلب، نسيب الاسم الافتراضي الموجود في الصفحة زي ما هو
      }
    }

    // =========================================================
    // Auth (نفس منطق index.html)
    // =========================================================

    async function checkAuth() {
      const accountLink = document.getElementById("nav-account-link");
      const avatarBtn = document.getElementById("nav-avatar-btn");
      const avatarInitial = document.getElementById("nav-avatar-initial");

      try {
        const res = await fetch("/api/auth/me", { credentials: "include" });
        if (!res.ok) throw new Error();

        const data = await res.json();
        const user = data.user || data.data;

        if (user && user.name) {
          const firstName = user.name.split(" ")[0];
          const isStaff = user.role === "admin" || user.role === "super_admin";
          const targetUrl = isStaff
            ? (user.role === "super_admin" ? "/super-admin.html" : "/admin.html")
            : "/orders.html";

          if (accountLink) {
            accountLink.textContent = isStaff ? `Dashboard (${firstName})` : `Hi, ${firstName}`;
            accountLink.href = targetUrl;
          }
          if (avatarBtn) avatarBtn.href = targetUrl;
          if (avatarInitial) {
            avatarInitial.innerHTML = `<span class="font-bold text-primary">${escapeHtml(firstName[0].toUpperCase())}</span>`;
            avatarInitial.classList.add("bg-primary-fixed");
          }
        }
      } catch (_) {
        if (accountLink) {
          accountLink.textContent = "Sign In";
          accountLink.href = "/login.html";
        }
      }
    }

    // =========================================================
    // Chat logic
    // =========================================================

    const messagesEl = document.getElementById("chat-messages");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("chat-input");
    const sendBtn = document.getElementById("chat-send-btn");
    const suggestionsEl = document.getElementById("chat-suggestions");

    // بنحتفظ بالمحادثة في الذاكرة بس (من غير حفظ دائم)
    let history = [];

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendUserMessage(text) {
      const wrapper = document.createElement("div");
      wrapper.className = "self-end max-w-[85%]";
      wrapper.innerHTML = `
        <div class="bg-primary text-on-primary font-body-md text-body-md rounded-xl rounded-tr-sm px-4 py-3">
          ${escapeHtml(text)}
        </div>
      `;
      messagesEl.appendChild(wrapper);
      scrollToBottom();
    }

    function appendAssistantMessage(text) {
      const wrapper = document.createElement("div");
      wrapper.className = "flex items-start gap-2.5 max-w-[85%]";
      wrapper.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 mt-0.5">
          <span class="material-symbols-outlined text-on-primary text-[16px]">smart_toy</span>
        </div>
        <div class="bg-surface-container text-on-surface font-body-md text-body-md rounded-xl rounded-tl-sm px-4 py-3 whitespace-pre-line">
          ${escapeHtml(text)}
        </div>
      `;
      messagesEl.appendChild(wrapper);
      scrollToBottom();
    }

    function appendTypingIndicator() {
      const wrapper = document.createElement("div");
      wrapper.id = "typing-indicator";
      wrapper.className = "flex items-start gap-2.5 max-w-[85%]";
      wrapper.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 mt-0.5">
          <span class="material-symbols-outlined text-on-primary text-[16px]">smart_toy</span>
        </div>
        <div class="bg-surface-container rounded-xl rounded-tl-sm px-4 py-3 flex items-center gap-1.5">
          <span class="typing-dot w-1.5 h-1.5 rounded-full bg-secondary inline-block"></span>
          <span class="typing-dot w-1.5 h-1.5 rounded-full bg-secondary inline-block"></span>
          <span class="typing-dot w-1.5 h-1.5 rounded-full bg-secondary inline-block"></span>
        </div>
      `;
      messagesEl.appendChild(wrapper);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      document.getElementById("typing-indicator")?.remove();
    }

    async function sendMessage(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      appendUserMessage(trimmed);
      inputEl.value = "";
      inputEl.style.height = "auto";

      sendBtn.disabled = true;
      inputEl.disabled = true;
      appendTypingIndicator();

      try {
        const res = await fetch("/api/ai_assistant", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: trimmed,
            history
          })
        });

        removeTypingIndicator();

        if (res.status === 429) {
          appendAssistantMessage("You're sending messages a bit too fast — please wait a moment and try again.");
          return;
        }

        const data = await res.json();

        if (!res.ok || !data.success) {
          appendAssistantMessage("Sorry, I couldn't process that right now. Please try again.");
          showToast(data.message || "AI assistant error");
          return;
        }

        const reply = data.data?.reply || "Sorry, I don't have an answer for that.";

        appendAssistantMessage(reply);

        history.push({ role: "user", content: trimmed });
        history.push({ role: "assistant", content: reply });

        // نحدّ من طول المحادثة المخزّنة
        history = history.slice(-10);

      } catch (err) {
        removeTypingIndicator();
        appendAssistantMessage("Sorry, something went wrong connecting to the assistant.");
        showToast("Network error");
      } finally {
        sendBtn.disabled = false;
        inputEl.disabled = false;
        inputEl.focus();
      }
    }

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(inputEl.value);
    });

    // إرسال بـ Enter (من غير Shift)
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(inputEl.value);
      }
    });

    // توسيع الـ textarea تلقائيًا
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = `${inputEl.scrollHeight}px`;
    });

    // اقتراحات سريعة
    suggestionsEl.querySelectorAll(".suggestion-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        sendMessage(chip.textContent.trim());
      });
    });

    document.addEventListener("DOMContentLoaded", () => {
      updateStoreName();
      checkAuth();
      inputEl.focus();
    });

  })();
</script>
  </body>
</html>
